<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIC Happy Valley - Church App Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/icon.png">
    <style>
        :root {
            --brand-gold: #f59e0b;
            --brand-dark: #1a1a1a;
            --brand-cream: #f5f5dc;
            --brand-darkGrey: #333333;
        }
        body {
            background: var(--brand-cream);
            color: var(--brand-darkGrey);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .brand-gold { color: var(--brand-gold); }
        .bg-brand-gold { background-color: var(--brand-gold); }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-darkGrey { color: var(--brand-darkGrey); }
        .border-brand-gold { border-color: var(--brand-gold); }
        .hover\:bg-yellow-500:hover { background-color: #eab308; }
        .hover\:border-brand-gold:hover { border-color: var(--brand-gold); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Download Button Component
        const DownloadButton = ({ title, url, content, type, className = '' }) => {
            const showToast = (message, type = 'success') => {
                const toast = document.createElement('div');
                toast.className = `fixed top-4 right-4 px-6 py-3 rounded-lg text-white font-medium z-50 transition-all transform translate-x-full ${
                    type === 'success' ? 'bg-green-600' : 'bg-red-600'
                }`;
                toast.textContent = message;
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.remove('translate-x-full');
                }, 100);
                
                setTimeout(() => {
                    toast.classList.add('translate-x-full');
                    setTimeout(() => {
                        document.body.removeChild(toast);
                    }, 300);
                }, 3000);
            };

            const handleDownload = async () => {
                try {
                    if (url) {
                        const response = await fetch(url);
                        const blob = await response.blob();
                        const downloadUrl = window.URL.createObjectURL(blob);
                        
                        const link = document.createElement('a');
                        link.href = downloadUrl;
                        link.download = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.jpg`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        window.URL.revokeObjectURL(downloadUrl);
                        
                        showToast('Image downloaded successfully!');
                    }
                } catch (error) {
                    console.error('Download failed:', error);
                    showToast('Download failed. Please try again.', 'error');
                }
            };

            const handleShare = async () => {
                if (navigator.share && url) {
                    try {
                        await navigator.share({
                            title: title,
                            url: url,
                            text: `Check out this image from AIC Happy Valley`
                        });
                        showToast('Shared successfully!');
                    } catch (error) {
                        console.log('Share cancelled or failed:', error);
                    }
                } else {
                    if (url) {
                        await navigator.clipboard.writeText(url);
                        showToast('Link copied to clipboard!');
                    }
                }
            };

            return (
                <div className={`flex gap-2 ${className}`}>
                    <button
                        onClick={handleDownload}
                        className="inline-flex items-center gap-2 px-4 py-2 bg-brand-gold text-black font-semibold rounded-lg hover:bg-yellow-500 transition-colors"
                        title={`Download ${title}`}
                    >
                        <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                        Download
                    </button>
                    
                    {url && (
                        <button
                            onClick={handleShare}
                            className="inline-flex items-center gap-2 px-4 py-2 bg-brand-dark text-white font-semibold rounded-lg border border-brand-gold/30 hover:border-brand-gold transition-colors"
                            title={`Share ${title}`}
                        >
                            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v10"/>
                            </svg>
                            Share
                        </button>
                    )}
                </div>
            );
        };

        // PWA Install Prompt Component
        const PWAInstallPrompt = () => {
            const [showPrompt, setShowPrompt] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowPrompt(true);
                };

                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            const handleInstall = async () => {
                if (!deferredPrompt) return;

                try {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setShowPrompt(false);
                    }
                    setDeferredPrompt(null);
                } catch (error) {
                    console.error('Error during PWA installation:', error);
                }
            };

            if (!showPrompt) return null;

            return (
                <div className="fixed bottom-4 left-4 right-4 md:left-auto md:right-4 md:w-96 bg-brand-dark border border-brand-gold rounded-xl p-4 shadow-2xl z-50">
                    <div className="flex items-start gap-3">
                        <div className="flex-shrink-0">
                            <div className="w-12 h-12 bg-brand-gold rounded-lg flex items-center justify-center">
                                <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                    <line x1="8" y1="21" x2="16" y2="21"/>
                                    <line x1="12" y1="17" x2="12" y2="21"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div className="flex-1 min-w-0">
                            <h3 className="text-white font-semibold mb-1">Install AIC Happy Valley App</h3>
                            <p className="text-gray-400 text-sm mb-3">
                                Get quick access to sermons, events, and more. Install our app on your device!
                            </p>
                            
                            <div className="flex gap-2">
                                <button
                                    onClick={handleInstall}
                                    className="flex items-center gap-2 px-4 py-2 bg-brand-gold text-black font-semibold rounded-lg hover:bg-yellow-500 transition-colors text-sm"
                                >
                                    <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                                    </svg>
                                    Install
                                </button>
                                
                                <button
                                    onClick={() => setShowPrompt(false)}
                                    className="px-3 py-2 text-gray-400 hover:text-white transition-colors"
                                >
                                    <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                        <line x1="18" y1="6" x2="6" y2="18"/>
                                        <line x1="6" y1="6" x2="18" y2="18"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeSection, setActiveSection] = useState('home');

            const images = [
                { id: 1, src: '/bishop.jpeg', title: 'Church Moment 1' },
                { id: 2, src: '/cadet.jpg', title: 'Church Moment 2' },
                { id: 3, src: '/church-drone-view.jpeg', title: 'Church Moment 3' },
                { id: 4, src: '/logo.png', title: 'Church Logo' }
            ];

            const sermons = [
                { id: 1, title: 'Faith in Action', date: '2024-03-24', description: 'A powerful message about living out your faith through deeds and actions.' },
                { id: 2, title: 'Finding Peace', date: '2024-03-17', description: 'Discovering inner peace through prayer and trust in God\'s plan.' }
            ];

            return (
                <div className="min-h-screen bg-brand-cream">
                    {/* Navigation */}
                    <nav className="bg-brand-dark text-white p-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <h1 className="text-2xl font-bold brand-gold">AIC Happy Valley</h1>
                            <div className="flex gap-6">
                                <button onClick={() => setActiveSection('home')} className={`hover:text-brand-gold transition-colors ${activeSection === 'home' ? 'text-brand-gold' : ''}`}>Home</button>
                                <button onClick={() => setActiveSection('sermons')} className={`hover:text-brand-gold transition-colors ${activeSection === 'sermons' ? 'text-brand-gold' : ''}`}>Sermons</button>
                                <button onClick={() => setActiveSection('gallery')} className={`hover:text-brand-gold transition-colors ${activeSection === 'gallery' ? 'text-brand-gold' : ''}`}>Gallery</button>
                                <button onClick={() => setActiveSection('admin')} className={`hover:text-brand-gold transition-colors ${activeSection === 'admin' ? 'text-brand-gold' : ''}`}>Admin</button>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto p-6">
                        {activeSection === 'home' && (
                            <div className="text-center py-20">
                                <h1 className="text-5xl font-bold mb-6 text-brand-darkGrey">Welcome to AIC Happy Valley</h1>
                                <p className="text-xl mb-8 text-gray-600">Your spiritual companion for faith, community, and growth</p>
                                <div className="bg-brand-dark text-white p-8 rounded-xl">
                                    <h2 className="text-2xl font-bold mb-4 brand-gold">Features Available</h2>
                                    <ul className="text-left space-y-2">
                                        <li>✅ PWA Installation - Install as native app</li>
                                        <li>✅ Download Sermons - Save and share messages</li>
                                        <li>✅ Gallery Downloads - Save church photos</li>
                                        <li>✅ Admin Workspace - Manage content</li>
                                        <li>✅ Share Functionality - Native sharing</li>
                                    </ul>
                                </div>
                            </div>
                        )}

                        {activeSection === 'sermons' && (
                            <div>
                                <h1 className="text-4xl font-bold mb-8 text-brand-darkGrey">Sermons Archive</h1>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {sermons.map(sermon => (
                                        <div key={sermon.id} className="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                                            <h3 className="text-xl font-bold mb-2">{sermon.title}</h3>
                                            <p className="text-gray-600 mb-4">{sermon.description}</p>
                                            <p className="text-sm text-gray-500 mb-4">{new Date(sermon.date).toLocaleDateString()}</p>
                                            <DownloadButton
                                                title={sermon.title}
                                                content={sermon.description}
                                                type="sermon"
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeSection === 'gallery' && (
                            <div>
                                <h1 className="text-4xl font-bold mb-8 text-brand-darkGrey">Gallery</h1>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {images.map(image => (
                                        <div key={image.id} className="group relative bg-white rounded-xl overflow-hidden shadow-lg">
                                            <img src={image.src} alt={image.title} className="w-full h-48 object-cover" />
                                            <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
                                                <DownloadButton
                                                    title={image.title}
                                                    url={image.src}
                                                    type="image"
                                                    className="w-full justify-center"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeSection === 'admin' && (
                            <div>
                                <h1 className="text-4xl font-bold mb-8 text-brand-darkGrey">Admin Workspace</h1>
                                <div className="bg-brand-dark text-white p-8 rounded-xl">
                                    <p className="mb-4">🔐 Protected admin area for content management</p>
                                    <p className="mb-4">📝 Manage sermons, events, and ministries</p>
                                    <p className="mb-4">🔥 Firebase authentication required</p>
                                    <p>✨ Full CRUD operations available</p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* PWA Install Prompt */}
                    <PWAInstallPrompt />
                </div>
            );
        };

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
